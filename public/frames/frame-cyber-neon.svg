<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Cyber Neon Gradients -->
    <linearGradient id="cyberCyanMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes spinHud {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes neonPulse {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px #00f0ff); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #00f0ff) drop-shadow(0 0 16px #ff007f); }
      }
      @keyframes blinkFast {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .pulse-neon {
        animation: neonPulse 2.5s ease-in-out infinite;
      }
      .hud-spin {
        transform-origin: 100px 100px;
        animation: spinHud 8s linear infinite;
      }
      .hud-spin-reverse {
        transform-origin: 100px 100px;
        animation: spinReverse 12s linear infinite;
      }
      .blink-node-1 {
        animation: blinkFast 1s steps(2, start) infinite;
      }
      .blink-node-2 {
        animation: blinkFast 1.5s steps(2, start) 0.5s infinite;
      }
    </style>
  </defs>

  <!-- Deep outer tech ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#0f172a" stroke-width="4" opacity="0.8" />

  <!-- Outer Neon Pulsing Ring -->
  <circle class="pulse-neon" cx="100" cy="100" r="90" fill="none" stroke="url(#cyberCyanMagenta)" stroke-width="4" filter="url(#neonGlowCyan)" />

  <!-- Rotating Segmented HUD Ring (Outer) -->
  <g class="hud-spin" opacity="0.9">
    <circle cx="100" cy="100" r="85" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="25 45 60 30" stroke-linecap="round" />
    <circle cx="100" cy="100" r="85" fill="none" stroke="#ff007f" stroke-width="2.5" stroke-dasharray="15 80 40 50" stroke-linecap="round" />
  </g>

  <!-- Reverse Rotating Tech Ticks (Inner) -->
  <g class="hud-spin-reverse" opacity="0.75">
    <circle cx="100" cy="100" r="81" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 10" />
  </g>

  <!-- Cyber Corner Brackets (Top-Left) -->
  <g filter="url(#neonGlowCyan)">
    <path d="M18 60 L18 24 L60 24" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="18" cy="24" r="2.5" fill="#ffffff" class="blink-node-1" />
  </g>

  <!-- Cyber Corner Brackets (Top-Right) -->
  <g filter="url(#neonGlowPink)">
    <path d="M140 24 L182 24 L182 60" fill="none" stroke="#ff007f" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="182" cy="24" r="2.5" fill="#ffffff" class="blink-node-2" />
  </g>

  <!-- Cyber Corner Brackets (Bottom-Right) -->
  <g filter="url(#neonGlowCyan)">
    <path d="M182 140 L182 176 L140 176" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="182" cy="176" r="2.5" fill="#ffffff" class="blink-node-1" />
  </g>

  <!-- Cyber Corner Brackets (Bottom-Left) -->
  <g filter="url(#neonGlowPink)">
    <path d="M60 176 L18 176 L18 140" fill="none" stroke="#ff007f" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="18" cy="176" r="2.5" fill="#ffffff" class="blink-node-2" />
  </g>

  <!-- Futuristic Target Reticle Badges at cardinal points -->
  <!-- Top Badge -->
  <g transform="translate(100, 10)">
    <rect x="-14" y="-3" width="28" height="6" rx="3" fill="#030712" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="-6" cy="0" r="1.5" fill="#ff007f" class="blink-node-1" />
    <circle cx="6" cy="0" r="1.5" fill="#00f0ff" class="blink-node-2" />
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(100, 190)">
    <rect x="-14" y="-3" width="28" height="6" rx="3" fill="#030712" stroke="#ff007f" stroke-width="1.5" />
    <circle cx="0" cy="0" r="1.5" fill="#00f0ff" class="blink-node-1" />
  </g>
</svg>
