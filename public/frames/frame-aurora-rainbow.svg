<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Multi-stop Rainbow Spectrum Gradient -->
    <linearGradient id="rainbowSpectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="16%" stop-color="#ff7f00" />
      <stop offset="33%" stop-color="#ffdf00" />
      <stop offset="50%" stop-color="#00ff7f" />
      <stop offset="66%" stop-color="#007fff" />
      <stop offset="83%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="rainbowPrismShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="auroraAura" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#00ffff" stop-opacity="0" />
      <stop offset="88%" stop-color="#ff00ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffff00" stop-opacity="0.6" />
    </radialGradient>

    <filter id="rainbowGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes rainbowPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.025); opacity: 1; filter: drop-shadow(0 0 8px #ff7f00); }
      }
      @keyframes rainbowSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes prismFlicker {
        0%, 100% { opacity: 0.3; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      .rainbow-ring {
        transform-origin: 100px 100px;
        animation: rainbowPulse 3s ease-in-out infinite;
      }
      .sweep-prism {
        transform-origin: 100px 100px;
        animation: rainbowSweep 5s linear infinite;
      }
      .flare-1 { transform-origin: 40px 35px; animation: prismFlicker 2s infinite ease-in-out; }
      .flare-2 { transform-origin: 160px 35px; animation: prismFlicker 2.5s infinite ease-in-out 0.6s; }
      .flare-3 { transform-origin: 165px 160px; animation: prismFlicker 2.2s infinite ease-in-out 1.2s; }
      .flare-4 { transform-origin: 35px 160px; animation: prismFlicker 2.7s infinite ease-in-out 0.3s; }
    </style>
  </defs>

  <!-- Aurora Outer Radiance -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#auroraAura)" stroke-width="6" />

  <!-- Prismatic Beaded Dotted Arc -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3 6" opacity="0.8" />

  <!-- Base Spectrum Halo -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#rainbowSpectrum)" stroke-width="9" opacity="0.65" filter="url(#rainbowGlow)" />

  <!-- Main Spectral Rainbow Ring -->
  <circle class="rainbow-ring" cx="100" cy="100" r="88" fill="none" stroke="url(#rainbowSpectrum)" stroke-width="6.5" />

  <!-- Inner Pure Silver Rim -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.95" />

  <!-- Rotating Prism Shimmer -->
  <g class="sweep-prism" opacity="0.75">
    <circle cx="100" cy="100" r="88" fill="none" stroke="url(#rainbowPrismShine)" stroke-width="7" stroke-dasharray="60 120" stroke-linecap="round" />
  </g>

  <!-- Top Prism Crystal Crown (12 o'clock) -->
  <g class="rainbow-ring" filter="url(#rainbowGlow)">
    <polygon points="100,10 108,24 100,30 92,24" fill="#ffffff" stroke="url(#rainbowSpectrum)" stroke-width="1.5" />
    <polygon points="100,13 105,23 100,27 95,23" fill="#00ffff" />
    <circle cx="100" cy="22" r="2" fill="#ffffff" />
  </g>

  <!-- Left / Right Prismatic Gems -->
  <g filter="url(#rainbowGlow)">
    <polygon points="12,100 22,93 28,100 22,107" fill="#ffffff" stroke="url(#rainbowSpectrum)" stroke-width="1.2" />
    <circle cx="21" cy="100" r="2" fill="#ff007f" />
    <polygon points="188,100 178,93 172,100 178,107" fill="#ffffff" stroke="url(#rainbowSpectrum)" stroke-width="1.2" />
    <circle cx="179" cy="100" r="2" fill="#00ff7f" />
  </g>

  <!-- Bottom Crystal Pendant -->
  <g transform="translate(100, 184)" filter="url(#rainbowGlow)">
    <polygon points="0,14 -8,0 0,3 8,0" fill="#ffffff" stroke="url(#rainbowSpectrum)" stroke-width="1.2" />
    <polygon points="0,9 -4,1 0,3 4,1" fill="#7f00ff" />
    <circle cx="0" cy="1" r="2" fill="#ffff00" />
  </g>

  <!-- Diamond Prism Sparkles -->
  <g class="flare-1">
    <polygon points="40,25 43,33 51,35 43,37 40,45 37,37 29,35 37,33" fill="#ffffff" filter="url(#rainbowGlow)" />
  </g>
  <g class="flare-2">
    <polygon points="160,26 162,32 168,34 162,36 160,42 158,36 152,34 158,32" fill="#ffff00" filter="url(#rainbowGlow)" />
  </g>
  <g class="flare-3">
    <polygon points="165,153 167,158 172,160 167,162 165,167 163,162 158,160 163,158" fill="#00ffff" />
  </g>
  <g class="flare-4">
    <polygon points="35,153 37,158 42,160 37,162 35,167 33,162 28,160 33,158" fill="#ff007f" />
  </g>
</svg>
