<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Steampunk Gradients -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="copperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes gearCW {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes gearCCW {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes steamPulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 5px #d97706); }
      }
      .steampunk-ring {
        transform-origin: 100px 100px;
        animation: steamPulse 3s ease-in-out infinite;
      }
      .gear-top-left {
        transform-origin: 40px 40px;
        animation: gearCW 8s linear infinite;
      }
      .gear-top-right {
        transform-origin: 160px 40px;
        animation: gearCCW 10s linear infinite;
      }
      .gear-bottom-left {
        transform-origin: 40px 160px;
        animation: gearCCW 9s linear infinite;
      }
      .gear-bottom-right {
        transform-origin: 160px 160px;
        animation: gearCW 7s linear infinite;
      }
    </style>
  </defs>

  <!-- Outer Copper Riveted Rim -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#78350f" stroke-width="5" />

  <!-- Screw Rivets on Outer Rim (12 rivets like a clock) -->
  <circle cx="100" cy="9" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="145" cy="21" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="179" cy="55" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="191" cy="100" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="179" cy="145" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="145" cy="179" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="100" cy="191" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="55" cy="179" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="21" cy="145" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="9" cy="100" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="21" cy="55" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />
  <circle cx="55" cy="21" r="2" fill="#fef08a" stroke="#451a03" stroke-width="0.8" />

  <!-- Base Heavy Brass Ring -->
  <circle class="steampunk-ring" cx="100" cy="100" r="87" fill="none" stroke="url(#brassGrad)" stroke-width="7" />

  <!-- Inner Copper Trim -->
  <circle cx="100" cy="100" r="83" fill="none" stroke="url(#copperGrad)" stroke-width="2" />

  <!-- Top Center Pressure Gauge / Compass -->
  <g transform="translate(100, 15)" filter="url(#gearGlow)">
    <circle cx="0" cy="0" r="10" fill="#fef3c7" stroke="#78350f" stroke-width="2" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 3" />
    <line x1="0" y1="0" x2="4" y2="-4" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="2" fill="#451a03" />
  </g>

  <!-- Bottom Steam Valve -->
  <g transform="translate(100, 186)" filter="url(#gearGlow)">
    <circle cx="0" cy="0" r="7" fill="#b45309" stroke="#fef08a" stroke-width="1.5" />
    <rect x="-10" y="-2" width="20" height="4" rx="2" fill="#d97706" stroke="#451a03" stroke-width="0.8" />
  </g>

  <!-- Corner Mechanical Rotating Cogwheels -->
  <!-- Cog Top-Left -->
  <g class="gear-top-left" filter="url(#gearGlow)">
    <g transform="translate(40, 40)">
      <circle cx="0" cy="0" r="12" fill="url(#brassGrad)" stroke="#451a03" stroke-width="1" />
      <path d="M-14 -3 L-14 3 L-10 3 L-10 -3 Z M10 -3 L10 3 L14 3 L14 -3 Z M-3 -14 L3 -14 L3 -10 L-3 -10 Z M-3 10 L3 10 L3 14 L-3 14 Z M-10 -10 L-7 -12 L-5 -9 L-8 -7 Z M7 7 L10 5 L12 8 L9 10 Z M-10 10 L-12 7 L-9 5 L-7 8 Z M10 -10 L12 -7 L9 -5 L7 -8 Z" fill="#d97706" />
      <circle cx="0" cy="0" r="5" fill="#451a03" />
      <circle cx="0" cy="0" r="2" fill="#fef08a" />
    </g>
  </g>

  <!-- Cog Top-Right -->
  <g class="gear-top-right" filter="url(#gearGlow)">
    <g transform="translate(160, 40)">
      <circle cx="0" cy="0" r="10" fill="url(#copperGrad)" stroke="#451a03" stroke-width="1" />
      <path d="M-12 -2.5 L-12 2.5 L-8 2.5 L-8 -2.5 Z M8 -2.5 L8 2.5 L12 2.5 L12 -2.5 Z M-2.5 -12 L2.5 -12 L2.5 -8 L-2.5 -8 Z M-2.5 8 L2.5 8 L2.5 12 L-2.5 12 Z" fill="#b45309" />
      <circle cx="0" cy="0" r="4" fill="#451a03" />
      <circle cx="0" cy="0" r="1.5" fill="#fef08a" />
    </g>
  </g>

  <!-- Cog Bottom-Left -->
  <g class="gear-bottom-left" filter="url(#gearGlow)">
    <g transform="translate(40, 160)">
      <circle cx="0" cy="0" r="10" fill="url(#copperGrad)" stroke="#451a03" stroke-width="1" />
      <path d="M-12 -2.5 L-12 2.5 L-8 2.5 L-8 -2.5 Z M8 -2.5 L8 2.5 L12 2.5 L12 -2.5 Z M-2.5 -12 L2.5 -12 L2.5 -8 L-2.5 -8 Z M-2.5 8 L2.5 8 L2.5 12 L-2.5 12 Z" fill="#b45309" />
      <circle cx="0" cy="0" r="4" fill="#451a03" />
      <circle cx="0" cy="0" r="1.5" fill="#fef08a" />
    </g>
  </g>

  <!-- Cog Bottom-Right -->
  <g class="gear-bottom-right" filter="url(#gearGlow)">
    <g transform="translate(160, 160)">
      <circle cx="0" cy="0" r="12" fill="url(#brassGrad)" stroke="#451a03" stroke-width="1" />
      <path d="M-14 -3 L-14 3 L-10 3 L-10 -3 Z M10 -3 L10 3 L14 3 L14 -3 Z M-3 -14 L3 -14 L3 -10 L-3 -10 Z M-3 10 L3 10 L3 14 L-3 14 Z" fill="#d97706" />
      <circle cx="0" cy="0" r="5" fill="#451a03" />
      <circle cx="0" cy="0" r="2" fill="#fef08a" />
    </g>
  </g>
</svg>
