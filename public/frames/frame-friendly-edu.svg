<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Cheerful Gradients -->
    <linearGradient id="eduRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="yellowCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" flood-color="#1e293b" />
    </filter>

    <style>
      @keyframes floatBounce {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(4px) rotate(-2deg); }
      }
      @keyframes twinklePop {
        0%, 100% { transform: scale(0.8); opacity: 0.6; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      @keyframes spinTassel {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(10deg); }
      }

      .floating-cap {
        transform-origin: 160px 35px;
        animation: floatBounce 3s ease-in-out infinite;
      }
      .floating-book {
        transform-origin: 40px 165px;
        animation: floatReverse 3.5s ease-in-out infinite;
      }
      .tassel-swing {
        transform-origin: 165px 33px;
        animation: spinTassel 2s ease-in-out infinite;
      }
      .star-pop-1 {
        transform-origin: 32px 42px;
        animation: twinklePop 2s ease-in-out infinite;
      }
      .star-pop-2 {
        transform-origin: 172px 145px;
        animation: twinklePop 2.4s ease-in-out 0.6s infinite;
      }
      .star-pop-3 {
        transform-origin: 100px 185px;
        animation: twinklePop 2.2s ease-in-out 1.2s infinite;
      }
    </style>
  </defs>

  <!-- Outer colorful glow ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#eduRainbow)" stroke-width="7" stroke-linecap="round" filter="url(#softShadow)" />

  <!-- Inner stitched dashed ring -->
  <circle cx="100" cy="100" r="83" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.9" />

  <!-- Dotted decorative perimeter -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 12" opacity="0.6" />

  <!-- Graduation Cap (Top-Right) -->
  <g class="floating-cap" filter="url(#softShadow)">
    <!-- Mortarboard Diamond -->
    <polygon points="160,18 184,28 160,38 136,28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="160,20 180,28 160,36 140,28" fill="#3b82f6" />
    <!-- Cap Skull -->
    <path d="M148,32 Q160,42 172,32 L172,37 Q160,47 148,37 Z" fill="#1e293b" />
    <!-- Button on Cap -->
    <circle cx="160" cy="28" r="2.5" fill="#fbbf24" />
    <!-- Tassel -->
    <g class="tassel-swing">
      <path d="M160,28 Q170,30 174,38 L176,46" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" />
      <polygon points="174,44 178,44 176,50" fill="#f59e0b" />
    </g>
  </g>

  <!-- Open Book & Pencil Badge (Bottom-Left) -->
  <g class="floating-book" filter="url(#softShadow)">
    <!-- Book Spine & Pages -->
    <path d="M26,160 Q38,155 46,161 Q54,155 66,160 L66,174 Q54,169 46,174 Q38,169 26,174 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    <path d="M26,160 Q38,155 46,161 L46,174 Q38,169 26,174 Z" fill="#f8fafc" />
    <path d="M46,161 Q54,155 66,160 L66,174 Q54,169 46,174 Z" fill="#f1f5f9" />
    <!-- Book Cover Base -->
    <path d="M24,173 Q36,167 46,173 Q56,167 68,173" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <!-- Mini Star on Book -->
    <circle cx="46" cy="167" r="2" fill="#fbbf24" />
    <!-- Cute Pencil Angle -->
    <g transform="translate(56, 150) rotate(-35)">
      <rect x="-3" y="-12" width="6" height="18" rx="2" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.8" />
      <polygon points="-3,-12 3,-12 0,-18" fill="#fbcfe8" stroke="#f43f5e" stroke-width="0.8" />
      <polygon points="-3,6 3,6 0,11" fill="#fde68a" stroke="#d97706" stroke-width="0.8" />
      <polygon points="-1,9 1,9 0,11" fill="#1e293b" />
    </g>
  </g>

  <!-- Twinkling Cheerful Stars -->
  <!-- Top Left Star -->
  <g class="star-pop-1" filter="url(#softShadow)">
    <path d="M32,32 L34.5,39 L42,41.5 L34.5,44 L32,51 L29.5,44 L22,41.5 L29.5,39 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Right Star -->
  <g class="star-pop-2" filter="url(#softShadow)">
    <path d="M172,138 L174,143 L179,145 L174,147 L172,152 L170,147 L165,145 L170,143 Z" fill="#34d399" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Bottom Mini Star -->
  <g class="star-pop-3">
    <circle cx="100" cy="188" r="3" fill="#f43f5e" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
