name: Deploy to Vercel

on:
  push:
    branches:
      - develop # หรือเปลี่ยนเป็น main / master ตาม branch ที่คุณใช้งาน

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดจาก Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ตั้งค่า Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 3. ติดตั้ง Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 4. ดึง Environment Information จาก Vercel มาเตรียมไว้
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # 5. สร้างไฟล์ .env.production สำหรับ Vite (ดึงค่าจาก GitHub Secrets ของคุณ)
      - name: Create Env File
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> .env.production
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env.production

      # 6. Build โปรเจกต์ผ่าน Vercel
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # 7. Deploy ขึ้น Vercel พร้อมส่งค่า Org ID และ Project ID
      - name: Deploy Project to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}