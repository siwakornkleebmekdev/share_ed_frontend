name: Deploy to Vercel

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 1. ติดตั้ง Dependencies ทั้งหมด
      - name: Install Dependencies
        run: npm ci

      # 2. สร้างไฟล์ .env.production และฝังค่าจาก GitHub Secrets ก่อน Build
      - name: Create Env File
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> .env.production
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env.production

      # 3. สั่ง Build โปรเจกต์ด้วย Vite (ตัวแปร VITE_ จะถูกฝังลงในโค้ดตอนนี้ชัวร์ 100%)
      - name: Build Project
        run: npm run build

      # 4. ติดตั้ง Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 5. Deploy โฟลเดอร์ที่ Build เสร็จแล้ว (dist) ขึ้น Vercel โดยตรง
      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}